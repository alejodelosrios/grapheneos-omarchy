# Port of basecamp/omarchy themes/catppuccin-latte/colors.toml (MIT). Keys are identical
# so a theme can be re-imported with tools/new-theme.sh; the [android] table is ours.
name = "Catppuccin Latte"
mode = "light"

accent = "#1e66f5"
selection = "#ccd0da"
muted = "#acb0be"

background = "#eff1f5"
dark_background = "#e3e4e8"
darker_background = "#d7d8dc"
lighter_background = "#dce0e8"

foreground = "#4c4f69"
dark_foreground = "#9ca0b0"
light_foreground = "#5c5f77"
bright_foreground = "#4c4f69"

red = "#d20f39"
yellow = "#df8e1d"
orange = "#d84e2b"
green = "#40a02b"
cyan = "#179299"
blue = "#1e66f5"
magenta = "#ea76cb"
brown = "#6c2715"

bright_red = "#d20f39"
bright_yellow = "#df8e1d"
bright_green = "#40a02b"
bright_cyan = "#179299"
bright_blue = "#1e66f5"
bright_magenta = "#ea76cb"

[android]
palette_package = "org.omarchy.palette.catppuccinlatte"
theme_style = "TONAL_SPOT"   # fallback seed mode if the palette RRO is unavailable
font = "jetbrains-mono-nerd"
icon_shape = "rounded-square"
themed_icons = "true"
